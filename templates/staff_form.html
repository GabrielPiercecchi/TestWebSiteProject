{% extends "base.html" %}
{% block title %}Nuovo staff · Gabriel's Hotel{% endblock %}
{% block content %}<section class="form-page admin-form-page"><div class="page-heading compact"><p class="eyebrow">Amministrazione</p><h1>Crea utenza <em>staff.</em></h1><p class="muted">Lo staff potrà gestire le camere, ma non potrà annullare prenotazioni né creare altri utenti.</p></div><form method="post" class="form-stack admin-form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nome completo<input name="name" required minlength="2" maxlength="120"></label><label>Email<input type="email" name="email" required maxlength="255"></label><label>Password<input class="password-field" type="password" name="password" required minlength="10"></label><label>Conferma password<input class="password-field" type="password" name="password_confirmation" required minlength="10"></label><div class="form-actions"><a class="text-link" href="{{ url_for('admin') }}">Annulla</a><button class="button button-dark" type="submit">Crea utenza <span>↗</span></button></div></form></section>{% endblock %}
